name: Resign WeChat IPA

on:
  workflow_dispatch:

# ==========================================
# 可以在这里直接写死你的临时配置
# ==========================================
env:
  IPA_DOWNLOAD_URL: 'https://pub-4e60f9bf8bd54482bd4ffb673efb8507.r2.dev/ipa/WeChat_8.0.66_iOSXY.ipa'
  NEW_BUNDLE_ID: 'com.miaolian.wechat'
  APP_NAME: '微信分身'
# ==========================================

jobs:
  resign:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fastlane & AWS CLI
        run: |
          gem install fastlane
          pip3 install awscli --break-system-packages 2>/dev/null || pip3 install awscli
          brew install qrencode

      - name: Download IPA
        run: |
          mkdir -p input_ipa
          echo "正在从直链下载脱壳 IPA..."
          curl -L -o input_ipa/original.ipa "${{ env.IPA_DOWNLOAD_URL }}"

      - name: Fetch or Create Ad Hoc Profile via Match
        working-directory: ios
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          echo "动态生成临时 Fastfile，强制注入 API Key，避开旧 Appfile 干扰..."
          cat <<EOF > fastlane/Fastfile_resign
          lane :fetch_cert do
            app_store_connect_api_key(
              key_id: ENV["API_KEY_ID"],
              issuer_id: ENV["API_ISSUER_ID"],
              key_content: ENV["API_KEY_CONTENT"],
              is_key_content_base64: false
            )
            match(
              type: "adhoc",
              app_identifier: "${{ env.NEW_BUNDLE_ID }}"
            )
          end
          EOF
          
          fastlane fetch_cert --fastfile fastlane/Fastfile_resign

      - name: Modify Package & Resign
        run: |
          set -e
          echo "== 1. 解压 IPA =="
          unzip -q input_ipa/original.ipa -d /tmp/wechat_work
          APP_PATH=$(find /tmp/wechat_work/Payload -maxdepth 1 -name "*.app")
          echo "App 路径: $APP_PATH"

          echo "== 2. 移除与个人证书冲突的扩展和 Watch 插件 =="
          rm -rf "$APP_PATH/PlugIns" "$APP_PATH/Watch" "$APP_PATH/_CodeSignature"

          echo "== 3. 查找 fastlane 下载的 profile 文件 =="
          PROV_FILE=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" -print0 | xargs -0 ls -t | head -n 1)
          echo "使用的描述文件: $PROV_FILE"
          cp "$PROV_FILE" "$APP_PATH/embedded.mobileprovision"

          echo "== 4. 提取 Entitlements 权限信息 =="
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/profile.plist > /tmp/entitlements.plist

          echo "== 5. 修改 Info.plist 的 Bundle ID、显示名称并开启‘文件’App访问 =="
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${{ env.NEW_BUNDLE_ID }}" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${{ env.APP_NAME }}" "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP_PATH/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$APP_PATH/Info.plist"
          
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$APP_PATH/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$APP_PATH/Info.plist"

          echo "== 6. 获取签名身份并逐级重签名 =="
          SIGN_IDENTITY=$(security find-identity -v -p codesigning | grep "Apple" | head -