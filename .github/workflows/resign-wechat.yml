name: Resign WeChat IPA

on:
  workflow_dispatch:

# ==========================================
# 可以在这里直接写死你的临时配置
# ==========================================
env:
  IPA_DOWNLOAD_URL: 'https://pub-4e60f9bf8bd54482bd4ffb673efb8507.r2.dev/ipa/com.tencent.xin-8.0.80-Decrypted.ipa'
  NEW_BUNDLE_ID: 'com.miaolian.wechat'
  APP_NAME: '微信'
# ==========================================

jobs:
  resign:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fastlane & AWS CLI
        run: |
          gem install fastlane
          pip3 install awscli --break-system-packages 2>/dev/null || pip3 install awscli
          brew install qrencode

      - name: Download IPA
        run: |
          mkdir -p input_ipa
          echo "正在从直链下载脱壳 IPA..."
          curl -L --fail -o input_ipa/original.ipa "${{ env.IPA_DOWNLOAD_URL }}"
          ls -lh input_ipa/original.ipa

      - name: Fetch or Create Ad Hoc Profile via Match
        working-directory: ios
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          NEW_BUNDLE_ID: ${{ env.NEW_BUNDLE_ID }}
        run: |
          echo "备份旧的 Fastfile / Appfile，避免干扰..."
          mkdir -p fastlane
          [ -f fastlane/Fastfile ] && mv fastlane/Fastfile fastlane/Fastfile.bak || true
          [ -f fastlane/Appfile ] && mv fastlane/Appfile fastlane/Appfile.bak || true

          echo "动态生成临时 Fastfile，强制注入 API Key..."
          cat <<'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            lane :fetch_cert do
              # CI 上创建临时 keychain，避免证书导入时弹窗卡住
              setup_ci

              require "base64"
              require "openssl"

              # 规范化 .p8 私钥：兼容 换行丢失 / 字面量 \n / 带引号 / 整个文件 base64 这几种常见的 secret 填法
              raw = ENV["API_KEY_CONTENT"].to_s.strip
              raw = raw.delete_prefix('"').delete_suffix('"').delete_prefix("'").delete_suffix("'")
              raw = raw.gsub("\\n", "\n")
              body = raw.gsub(/-----[A-Z ]+-----/, "").gsub(/\s+/, "")
              UI.user_error!("APP_STORE_CONNECT_API_KEY_CONTENT 是空的，请检查 GitHub secret") if body.empty?

              unless raw.include?("BEGIN")
                decoded = Base64.decode64(body)
                if decoded.include?("BEGIN")
                  body = decoded.gsub(/-----[A-Z ]+-----/, "").gsub(/\s+/, "")
                end
              end

              pem = "-----BEGIN PRIVATE KEY-----\n" +
                    body.scan(/.{1,64}/).join("\n") +
                    "\n-----END PRIVATE KEY-----\n"

              begin
                pkey = OpenSSL::PKey.read(pem)
                UI.message("API Key 解析成功，类型: #{pkey.class}")
              rescue => e
                UI.user_error!("API Key 解析失败（#{e.class}: #{e.message}），说明 secret 内容不是完整有效的 .p8 私钥")
              end

              app_store_connect_api_key(
                key_id: ENV["API_KEY_ID"],
                issuer_id: ENV["API_ISSUER_ID"],
                key_content: pem,
                is_key_content_base64: false
              )

              match_opts = {
                type: "adhoc",
                app_identifier: ENV["NEW_BUNDLE_ID"],
                readonly: false
              }
              match(match_opts)
            end
          end
          EOF

          fastlane fetch_cert

      - name: Modify Package & Resign
        run: |
          set -e
          echo "== 1. 解压 IPA =="
          rm -rf /tmp/wechat_work
          # -o：遇到同名/大小写冲突的文件直接覆盖，不交互询问（有些 IPA 里有重复条目）
          unzip -q -o input_ipa/original.ipa -d /tmp/wechat_work
          APP_PATH=$(find /tmp/wechat_work/Payload -maxdepth 1 -name "*.app" | head -n 1)
          echo "App 路径: $APP_PATH"
          INFO="$APP_PATH/Info.plist"

          echo "== 1.5 检查是否已脱壳（cryptid 必须为 0）=="
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO")
          if otool -l "$APP_PATH/$EXEC_NAME" | grep -q "cryptid 1"; then
            echo "❌ 这个 IPA 还是加密的（cryptid 1），没有脱壳。重签后无法启动，请换一个已脱壳的 IPA。"
            exit 1
          fi
          echo "✅ 已脱壳 (cryptid 0)"

          echo "== 2. 移除与个人证书冲突的扩展和 Watch 插件 =="
          rm -rf "$APP_PATH/PlugIns" "$APP_PATH/Watch" "$APP_PATH/_CodeSignature"

          echo "== 3. 查找 fastlane 下载的 profile 文件 =="
          PROV_FILE=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" -print0 | xargs -0 ls -t | head -n 1)
          echo "使用的描述文件: $PROV_FILE"
          cp "$PROV_FILE" "$APP_PATH/embedded.mobileprovision"

          echo "== 4. 提取 Entitlements 权限信息 =="
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/profile.plist > /tmp/entitlements.plist

          echo "== 5. 修改 Info.plist 的 Bundle ID、显示名称并开启‘文件’App访问 =="
          # 通用函数：键存在就 Set，不存在就 Add
          plist_put() {
            /usr/libexec/PlistBuddy -c "Set :$1 $3" "$INFO" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$INFO"
          }
          plist_put CFBundleIdentifier  string "${{ env.NEW_BUNDLE_ID }}"
          plist_put CFBundleDisplayName string "${{ env.APP_NAME }}"
          plist_put UIFileSharingEnabled bool true
          plist_put LSSupportsOpeningDocumentsInPlace bool true

          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO")
          echo "BUNDLE_VERSION=$BUNDLE_VERSION" >> "$GITHUB_ENV"

          echo "== 6. 获取签名身份并逐级重签名 =="
          SIGN_IDENTITY=$(security find-identity -v -p codesigning | grep -E "Distribution" | head -n 1 | awk '{print $2}')
          if [ -z "$SIGN_IDENTITY" ]; then
            SIGN_IDENTITY=$(security find-identity -v -p codesigning | grep "Apple" | head -n 1 | awk '{print $2}')
          fi
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "未找到可用的签名证书"
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "签名身份: $SIGN_IDENTITY"

          # 由内向外签名：dylib、framework（-depth 保证子目录先于父目录）
          find "$APP_PATH" -depth \( -name "*.dylib" -o -name "*.framework" -o -name "*.appex" \) -print0 | \
            while IFS= read -r -d '' ITEM; do
              echo "签名: ${ITEM#$APP_PATH/}"
              codesign -f -s "$SIGN_IDENTITY" "$ITEM"
            done

          # 最后签主程序（带 entitlements）
          codesign -f -s "$SIGN_IDENTITY" --entitlements /tmp/entitlements.plist "$APP_PATH"

          echo "== 7. 校验签名 =="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | head -n 40 || true

          echo "== 8. 重新打包 IPA =="
          mkdir -p "$GITHUB_WORKSPACE/output"
          (cd /tmp/wechat_work && zip -qry "$GITHUB_WORKSPACE/output/WeChat_resigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/output/WeChat_resigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChat_resigned
          path: output/WeChat_resigned.ipa
          retention-days: 7

      - name: Get build info
        id: build_info
        run: |
          BUILD_TIME=$(date +%Y%m%d-%H%M%S)
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=WeChatClone-${BUILD_TIME}.ipa" >> "$GITHUB_OUTPUT"

      - name: Generate manifest.plist
        run: |
          cat <<EOF > manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${{ vars.R2_PUBLIC_URL }}/wechat-clone/${{ steps.build_info.outputs.ipa_name }}</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>${{ env.NEW_BUNDLE_ID }}</string>
                          <key>bundle-version</key>
                          <string>${BUNDLE_VERSION}</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>${{ env.APP_NAME }}</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

      - name: Upload IPA + manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          aws s3 cp output/WeChat_resigned.ipa \
            "s3://${{ secrets.R2_BUCKET }}/wechat-clone/${{ steps.build_info.outputs.ipa_name }}" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/octet-stream"

          aws s3 cp manifest.plist \
            "s3://${{ secrets.R2_BUCKET }}/wechat-clone/manifest-${{ steps.build_info.outputs.build_time }}.plist" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/xml"

      - name: Print install link
        run: |
          MANIFEST_URL="${{ vars.R2_PUBLIC_URL }}/wechat-clone/manifest-${{ steps.build_info.outputs.build_time }}.plist"
          INSTALL_LINK="itms-services://?action=download-manifest&url=${MANIFEST_URL}"
          echo "$INSTALL_LINK" > install_link.txt
          echo "=================================================="
          echo "📱 手机Safari打开下面链接直接安装:"
          echo "$INSTALL_LINK"
          echo "=================================================="
          echo "### 📱 手机安装链接" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$INSTALL_LINK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[点击安装](${INSTALL_LINK})" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate QR code and upload to R2
        id: qr
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          INSTALL_LINK=$(cat install_link.txt)
          qrencode -o qrcode.png -s 10 -m 2 "$INSTALL_LINK"

          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          QR_NAME="qrcode-${{ steps.build_info.outputs.build_time }}.png"

          aws s3 cp qrcode.png \
            "s3://${{ secrets.R2_BUCKET }}/wechat-clone/qrcode/${QR_NAME}" \
            --endpoint-url "$ENDPOINT" \
            --content-type "image/png"

          echo "qr_name=${QR_NAME}" >> "$GITHUB_OUTPUT"

      - name: Embed QR code in Summary
        run: |
          QR_URL="${{ vars.R2_PUBLIC_URL }}/wechat-clone/qrcode/${{ steps.qr.outputs.qr_name }}"
          {
            echo ""
            echo "### 📷 扫码安装 (iPhone相机或微信扫一扫)"
            echo ""
            echo "![install qrcode](${QR_URL})"
          } >> "$GITHUB_STEP_SUMMARY"