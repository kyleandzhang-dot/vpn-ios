name: iOS Beta Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  XCODE_VERSION: 'latest-stable'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      # - name: Set build number
      #   run: |
      #     VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1)
      #     sed -i.bak "s/^version: .*/version: ${VERSION_NAME}+${{ github.run_number }}/" pubspec.yaml
      #     cat pubspec.yaml | grep version

      - name: Find, Flatten Shallow Bundle and Verify committed Libbox
        run: |
          set -e
          echo "== 1. 寻找仓库中提交的 Libbox.xcframework =="
          LIBBOX_PATH=$(find ios -iname "Libbox.xcframework" | head -n 1)
          if [ -z "$LIBBOX_PATH" ]; then
            echo "❌ 找不到 Libbox.xcframework！"
            exit 1
          fi
          
          echo "== 2. 执行 Shallow Bundle 扁平化与 ID 初次覆写 =="
          find "$LIBBOX_PATH" -name "*.framework" | while read -r FW_PATH; do
            if [ -d "$FW_PATH/Versions" ]; then
              TMP_DIR=$(mktemp -d)
              REAL_DIR="$FW_PATH/Versions/Current"
              [ ! -d "$REAL_DIR" ] && REAL_DIR="$FW_PATH/Versions/A"
              cp -R -L "$REAL_DIR/"* "$TMP_DIR/" 2>/dev/null || true
              if [ -f "$TMP_DIR/Resources/Info.plist" ]; then
                cp -L "$TMP_DIR/Resources/Info.plist" "$TMP_DIR/Info.plist" 2>/dev/null || true
              fi
              rm -rf "$FW_PATH/"*
              cp -R "$TMP_DIR/"* "$FW_PATH/" 2>/dev/null || true
              rm -rf "$TMP_DIR"
            fi

            rm -f "$FW_PATH/Info.plist"
            cat <<EOF > "$FW_PATH/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>Libbox</string>
            <key>CFBundleIdentifier</key>
            <string>Libbox</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Libbox</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          EOF
          done

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build Flutter iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fastlane
        run: gem install fastlane

      # 【新增核心绝杀步骤】在 pod install 跑完、Fastlane 开始打包的前一刻，
      # 对整个 CI 机器所有残留或被 Pods 恢复出来的 Libbox 进行最后一次无条件覆盖！
      - name: Force Lock Libbox Bundle ID Before Archiving
        run: |
          set -e
          echo "== Fastlane 打包前夕：扫荡 Pods 及全网所有 Libbox.framework =="
          find $GITHUB_WORKSPACE ~/Library/Caches/CocoaPods ~/.pub-cache -name "Libbox*.framework" 2>/dev/null | while read -r FW_PATH; do
            echo "正在强行锁死目标: $FW_PATH"
            
            # 如果 Pods 缓存里还有深层嵌套，顺手干掉
            if [ -d "$FW_PATH/Versions" ]; then
              TMP_DIR=$(mktemp -d)
              REAL_DIR="$FW_PATH/Versions/Current"
              [ ! -d "$REAL_DIR" ] && REAL_DIR="$FW_PATH/Versions/A"
              cp -R -L "$REAL_DIR/"* "$TMP_DIR/" 2>/dev/null || true
              if [ -f "$TMP_DIR/Resources/Info.plist" ]; then
                cp -L "$TMP_DIR/Resources/Info.plist" "$TMP_DIR/Info.plist" 2>/dev/null || true
              fi
              rm -rf "$FW_PATH/"*
              cp -R "$TMP_DIR/"* "$FW_PATH/" 2>/dev/null || true
              rm -rf "$TMP_DIR"
            fi

            # 无条件强行重写，把 CFBundleIdentifier 绝对锁死在 "Libbox"！
            rm -f "$FW_PATH/Info.plist"
            cat <<EOF > "$FW_PATH/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>Libbox</string>
            <key>CFBundleIdentifier</key>
            <string>Libbox</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Libbox</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          EOF
            echo "✅ [$FW_PATH] 已成功锁死为 Libbox！"
          done

      - name: Run fastlane adhoc (Ad Hoc签名，用于R2/Diawi分发，不走TestFlight)
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: fastlane adhoc

      - name: Run fastlane beta (可选，由仓库Variable PUSH_TO_TESTFLIGHT 控制，推送TestFlight)
        if: ${{ vars.PUSH_TO_TESTFLIGHT == 'true' }}
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: fastlane beta

      - name: Get build info
        id: build_info
        run: |
          BUILD_TIME=$(date +%Y%m%d-%H%M%S)
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=MiaoLianVpn-${BUILD_TIME}.ipa" >> "$GITHUB_OUTPUT"

      - name: Generate manifest.plist
        run: |
          cat <<EOF > manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${{ secrets.R2_PUBLIC_URL }}/${{ steps.build_info.outputs.ipa_name }}</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>com.miaolian.myvpn</string>
                          <key>bundle-version</key>
                          <string>${{ github.run_number }}</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>秒连VPN</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

      - name: Install AWS CLI (for R2 upload, R2兼容S3协议)
        run: |
          if ! command -v aws &> /dev/null; then
            pip3 install awscli --break-system-packages 2>/dev/null || pip3 install awscli
          fi

      - name: Upload IPA + manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          aws s3 cp ios/Runner.ipa \
            "s3://${{ secrets.R2_BUCKET }}/${{ steps.build_info.outputs.ipa_name }}" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/octet-stream"

          aws s3 cp manifest.plist \
            "s3://${{ secrets.R2_BUCKET }}/manifest-${{ steps.build_info.outputs.build_time }}.plist" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/xml"

      - name: Print install link
        run: |
          MANIFEST_URL="${{ secrets.R2_PUBLIC_URL }}/manifest-${{ steps.build_info.outputs.build_time }}.plist"
          INSTALL_LINK="itms-services://?action=download-manifest&url=${MANIFEST_URL}"
          echo "=================================================="
          echo "📱 手机Safari打开下面链接直接安装:"
          echo "$INSTALL_LINK"
          echo "=================================================="
          echo "### 📱 安装链接手机" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$INSTALL_LINK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[点击安装](${INSTALL_LINK})" >> "$GITHUB_STEP_SUMMARY"